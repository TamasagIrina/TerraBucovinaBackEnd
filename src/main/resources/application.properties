spring.application.name=Terra Bucovina Backend
server.port=3307

spring.datasource.url=jdbc:mysql://localhost:3306/terrabucovina?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

app.jwt.secret=${JWT_SECRET:XOyUXC8cQx0d+5Q2D0GGtTGAoAVNqyx7AFZsuQjLQr+6SUl1kBO4PpInsa6Jlqb9caDxAn8OBH8F1HlebKuemQ==}
app.jwt.expiration-ms=9600000

# Base URLs used for the email-confirmation flow
app.backend-url=${APP_BACKEND_URL:http://localhost:3307}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# CORS: comma-separated list of allowed frontend origins (see SecurityConfig)
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}

# --- Brevo (transactional email via REST API v3) ---
brevo.sender.email=tamasagiuliana@gmail.com
brevo.sender.name=TerraBucovina
brevo.api.url=https://api.brevo.com/v3/smtp/email
brevo.api.key=${BREVO_API_KEY:}


# Monthly admin summary email — 09:00 on the 28th of each month (Europe/Bucharest)
app.monthly-summary.cron=0 0 9 28 * *

# --- Chatbot (Google Gemini free tier) ---
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.key=${GEMINI_API_KEY:}

# --- Cloudflare R2 (S3-compatible object storage for product/plant images) ---
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.bucket-name=${R2_BUCKET_NAME:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.public-url=${R2_PUBLIC_URL:}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always