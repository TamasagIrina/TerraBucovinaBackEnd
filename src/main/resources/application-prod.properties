# Production overrides, activated via SPRING_PROFILES_ACTIVE=prod.
# Everything not listed here (Brevo, Gemini, R2, JWT expiration, etc.) is
# inherited from application.properties.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:terrabucovina}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Never leak stack traces to API clients in production.
server.error.include-stacktrace=never

app.backend-url=${APP_BACKEND_URL:https://terrabucovina-api.com}
