<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmare comanda</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
<h2>Salut <span th:text="${fullName}">Client</span>,</h2>
<p>Comanda dumneavoastra a fost plasata cu succes!</p>

<h3>Produsele comandate:</h3>
<table style="width:100%; border-collapse: collapse;">
    <thead>
    <tr>
        <th style="border:1px solid #ddd; padding:8px;">Produs</th>
        <th style="border:1px solid #ddd; padding:8px;">Imagine</th>
        <th style="border:1px solid #ddd; padding:8px;">Cantitate</th>
        <th style="border:1px solid #ddd; padding:8px;">Pret</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.name}" style="border:1px solid #ddd; padding:8px;"></td>
        <td style="border:1px solid #ddd; padding:8px;">
            <img th:src="${product.imageUrl}" style="max-width: 80px;" />
        </td>
        <td th:text="${product.quantity}" style="border:1px solid #ddd; padding:8px;"></td>
        <td th:text="${product.price} + ' RON'" style="border:1px solid #ddd; padding:8px;"></td>
    </tr>
    </tbody>
</table>

<p style="margin-top:20px;">Va multumim ca ati ales Terra Bucovina!</p>
</body>
</html>
